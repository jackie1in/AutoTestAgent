name: autotestagent

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: autotestagent-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/autotestagent
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - ./neo4j_data/data:/data
      - ./neo4j_data/logs:/logs
      - ./neo4j_data/plugins:/plugins
    restart: unless-stopped

  postgres:
    image: postgres:16
    pull_policy: always
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lmnr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lmnr_password}
      POSTGRES_DB: ${POSTGRES_DB:-lmnr}
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-lmnr}",
          "-d",
          "${POSTGRES_DB:-lmnr}",
        ]
      interval: 2s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    pull_policy: always
    volumes:
      - type: volume
        source: clickhouse-data
        target: /var/lib/clickhouse/
      - type: volume
        source: clickhouse-logs
        target: /var/log/clickhouse-server/
      - type: bind
        source: ./clickhouse-profiles-config.xml
        target: /etc/clickhouse-server/users.d/lmnr.xml
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-lmnr}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-lmnr_password}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  query-engine:
    image: ghcr.io/lmnr-ai/query-engine
    pull_policy: always
    ports:
      - "${QUERY_ENGINE_HOST_PORT:-8903}:8903"
    environment:
      PORT: 8903
    healthcheck:
      test: ["CMD", "sleep", "5"]
      interval: 10s
      timeout: 6s
      retries: 3
    restart: unless-stopped

  quickwit:
    image: quickwit/quickwit:v0.8.2
    pull_policy: always
    ports:
      - "7280:7280"
      - "7281:7281"
    environment:
      QW_DATA_DIR: /quickwit/qwdata
    command: ["run"]
    volumes:
      - quickwit-data:/quickwit/qwdata
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7280/health/livez"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    image: ghcr.io/lmnr-ai/frontend
    pull_policy: always
    ports:
      - "${FRONTEND_HOST_PORT:-5667}:5667"
    depends_on:
      postgres:
        condition: service_healthy
      quickwit:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lmnr}:${POSTGRES_PASSWORD:-lmnr_password}@postgres:5432/${POSTGRES_DB:-lmnr}
      PORT: 5667
      BACKEND_URL: http://app-server:8000
      BACKEND_RT_URL: http://app-server:8002
      SHARED_SECRET_TOKEN: ${SHARED_SECRET_TOKEN:-change_me_shared_secret}
      NEXTAUTH_URL: http://localhost:5667
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-some_secret}
      NEXT_PUBLIC_URL: http://localhost:5667
      ENVIRONMENT: LITE
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-lmnr}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-lmnr_password}
      CLICKHOUSE_RO_USER: ${CLICKHOUSE_RO_USER:-lmnr_ro}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:-lmnr_ro_password}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AEAD_SECRET_KEY: ${AEAD_SECRET_KEY:-change_me_32_byte_secret}
      QUICKWIT_SEARCH_URL: http://quickwit:7280
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
    restart: unless-stopped

  app-server:
    image: ghcr.io/lmnr-ai/app-server
    pull_policy: always
    ports:
      - "${APP_SERVER_HOST_PORT:-8000}:8000"
      - "${APP_SERVER_GRPC_HOST_PORT:-8001}:8001"
      - "${APP_SERVER_RT_HOST_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      quickwit:
        condition: service_healthy
    environment:
      PORT: 8000
      GRPC_PORT: 8001
      DATABASE_URL: postgres://${POSTGRES_USER:-lmnr}:${POSTGRES_PASSWORD:-lmnr_password}@postgres:5432/${POSTGRES_DB:-lmnr}
      SHARED_SECRET_TOKEN: ${SHARED_SECRET_TOKEN:-change_me_shared_secret}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-lmnr}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-lmnr_password}
      CLICKHOUSE_RO_USER: ${CLICKHOUSE_RO_USER:-lmnr_ro}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:-lmnr_ro_password}
      ENVIRONMENT: LITE
      AEAD_SECRET_KEY: ${AEAD_SECRET_KEY:-change_me_32_byte_secret}
      QUERY_ENGINE_URL: http://query-engine:8903
      QUICKWIT_SEARCH_URL: http://quickwit:7280
      QUICKWIT_INGEST_URL: http://quickwit:7281
      QUICKWIT_SPANS_INDEX_ID: spans_v2
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
    restart: unless-stopped

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  quickwit-data:
