<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graph Agent — 图谱 · 意图 · 回放</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --bg: #1a1b26;
      --surface: #24283b;
      --text: #c0caf5;
      --muted: #565f89;
      --accent: #7aa2f7;
      --success: #9ece6a;
      --error: #f7768e;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
      min-height: 100vh;
    }
    h1 { font-size: 1.25rem; margin: 0 0 1rem 0; color: var(--accent); }
    section { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.25rem; color: var(--muted); font-size: 0.85rem; }
    select, input[type="text"], input[type="password"] {
      width: 100%;
      max-width: 320px;
      padding: 0.5rem 0.75rem;
      background: var(--surface);
      border: 1px solid var(--muted);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
    }
    button {
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #graph {
      width: 100%;
      height: 360px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--muted);
    }
    #log {
      font-size: 0.8rem;
      background: var(--surface);
      border: 1px solid var(--muted);
      border-radius: 8px;
      padding: 0.75rem;
      min-height: 120px;
      max-height: 280px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #log .line { margin: 0.2em 0; }
    #log .info { color: var(--text); }
    #log .success { color: var(--success); }
    #log .error { color: var(--error); }
    #log .final { font-weight: bold; margin-top: 0.5em; }
    .form-row { margin-bottom: 0.75rem; }
    .form-row:last-of-type { margin-bottom: 1rem; }
    .diagnostics {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      padding: 0.5rem;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--muted);
    }
    .diagnostics .missing { color: var(--error); }
  </style>
</head>
<body>
  <h1>Graph Agent — 图谱 · 意图 · 回放</h1>
  <nav style="margin-bottom:1rem;">
    <a href="/" style="color:var(--accent);text-decoration:none;margin-right:1rem;">图谱 · 意图 · 回放</a>
    <a href="/dashboard.html" style="color:var(--accent);text-decoration:none;">Dashboard</a>
  </nav>

  <section>
    <label>图谱</label>
    <div id="graph"></div>
    <div id="diagnostics" class="diagnostics" style="display:none;"></div>
  </section>

  <section>
    <label>意图</label>
    <select id="intents" aria-label="选择意图">
      <option value="">加载中…</option>
    </select>
  </section>

  <section>
    <label>测试数据</label>
    <div class="form-row">
      <label for="username">username</label>
      <input id="username" type="text" placeholder="请输入 username" />
    </div>
    <div class="form-row">
      <label for="password">password</label>
      <input id="password" type="password" placeholder="请输入 password" />
    </div>
    <button type="button" id="playback">回放</button>
  </section>

  <section>
    <label>回放日志</label>
    <div id="log"></div>
  </section>

  <script>
    (function () {
      const graphEl = document.getElementById("graph");
      const intentsSelect = document.getElementById("intents");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const playbackBtn = document.getElementById("playback");
      const logEl = document.getElementById("log");

      let network = null;

      function log(msg, level) {
        level = level || "info";
        const line = document.createElement("div");
        line.className = "line " + level;
        line.textContent = msg;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function clearLog() {
        logEl.innerHTML = "";
      }

      function renderGraph(nodes, edges) {
        const visNodes = new vis.DataSet(
          (nodes || []).map(function (n) {
            return { id: n.id, label: n.label || n.id, title: n.url || n.id };
          })
        );

        const visEdges = new vis.DataSet(
          (edges || []).map(function (e) {
            const summary = e.intent ? (e.intent.summary || e.intent.raw || "") : (e.semantic_label || "");
            const fallback = e.intent_failure_reason ? "[缺失] " + (e.intent_failure_reason.length > 40 ? e.intent_failure_reason.slice(0, 40) + "…" : e.intent_failure_reason) : "[无意图]";
            const label = summary || fallback || e.selector || "";
            const title = summary ? ((summary || "") + (e.selector ? " " + e.selector : "")) : (e.intent_failure_reason || fallback) + (e.selector ? " " + e.selector : "");
            return {
              from: e.source,
              to: e.target,
              label: label,
              title: title,
              arrows: "to",
              color: { color: e.intent ? "#565f89" : "#f7768e" }
            };
          })
        );

        const data = { nodes: visNodes, edges: visEdges };
        const options = {
          nodes: { 
            shape: "box", 
            font: { color: "#c0caf5", face: "monospace" },
            color: { background: "#24283b", border: "#7aa2f7" }
          },
          edges: { 
            font: { color: "#c0caf5", size: 10, align: "middle" },
            smooth: { type: "cubicBezier" }
          },
          physics: { 
            enabled: true, 
            stabilization: { iterations: 100 } 
          },
          layout: {
            randomSeed: 2
          }
        };
        
        if (!network) {
          network = new vis.Network(graphEl, data, options);
        } else {
          network.setData(data);
        }
      }

      function loadGraph() {
        fetch("/api/graph")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            renderGraph(data.nodes || [], data.edges || []);
            const diagEl = document.getElementById("diagnostics");
            const missing = data.missing_count || 0;
            const reasons = data.failure_reasons || [];
            if (missing > 0) {
              diagEl.style.display = "block";
              diagEl.innerHTML = "<span class=\"missing\">" + missing + " 条边缺失意图</span>" +
                (reasons.length ? "<br><details><summary>失败原因</summary><ul>" +
                  reasons.map(function (r) { return "<li>" + r + "</li>"; }).join("") + "</ul></details>" : "");
            } else {
              diagEl.style.display = "none";
            }
          })
          .catch(function (err) {
            log("加载图谱失败: " + err.message, "error");
          });
      }

      function loadIntents() {
        fetch("/api/intents")
          .then(function (r) { return r.json(); })
          .then(function (list) {
            intentsSelect.innerHTML = "";
            const empty = document.createElement("option");
            empty.value = "";
            empty.textContent = list.length ? "请选择意图" : "（无意图）";
            intentsSelect.appendChild(empty);
            (list || []).forEach(function (intent) {
              const opt = document.createElement("option");
              if (typeof intent === "string") {
                opt.value = intent;
                opt.textContent = intent;
              } else {
                opt.value = intent.value || "";
                const confidence = typeof intent.confidence === "number"
                  ? " (" + intent.confidence.toFixed(2) + ")"
                  : "";
                opt.textContent = (intent.label || intent.summary || intent.value || "") + confidence;
              }
              intentsSelect.appendChild(opt);
            });
          })
          .catch(function (err) {
            intentsSelect.innerHTML = "<option value=''>加载失败</option>";
            log("加载意图失败: " + err.message, "error");
          });
      }

      function runPlayback() {
        const intent = intentsSelect.value;
        if (!intent) {
          log("请先选择意图", "error");
          return;
        }
        const test_data = {
          username: usernameInput.value,
          password: passwordInput.value,
        };
        clearLog();
        log("开始回放: " + intent + " …");
        playbackBtn.disabled = true;

        fetch("/api/playback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ intent: intent, test_data: test_data }),
        })
          .then(function (response) {
            if (!response.ok) {
              return response.json().then(function (body) {
                throw new Error(body.error || "请求失败 " + response.status);
              });
            }
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            function processEvent(ev) {
              const msg = ev.message || ev.error || JSON.stringify(ev);
              const level = ev.level || "info";
              
              // Only log if it's not a raw object dump, or format it nicely
              if (ev.message) {
                  log(ev.message, level);
              } else if (ev.error) {
                  log(ev.error, level);
              }

              if (level === "success" || level === "error") {
                const finalMsg = level === "success"
                  ? "回放成功"
                  : "回放失败: " + (ev.error || msg);
                log(finalMsg, "final " + level);
                playbackBtn.disabled = false;
              }
            }

            function flushBlock(block) {
              const lines = block.split("\n");
              for (const line of lines) {
                  if (line.startsWith("data:")) {
                      const jsonStr = line.slice(5).trim();
                      if (!jsonStr) continue;
                      try {
                        processEvent(JSON.parse(jsonStr));
                      } catch (e) {
                          console.error("JSON parse error", e);
                      }
                  }
              }
            }

            function read() {
              return reader.read().then(function (result) {
                if (result.done) {
                  if (buffer.trim()) flushBlock(buffer);
                  playbackBtn.disabled = false;
                  return;
                }
                buffer += decoder.decode(result.value, { stream: true });
                // Process complete blocks separated by double newline
                let idx = buffer.indexOf("\n\n");
                while (idx !== -1) {
                  flushBlock(buffer.slice(0, idx));
                  buffer = buffer.slice(idx + 2);
                  idx = buffer.indexOf("\n\n");
                }
                return read();
              });
            }
            return read();
          })
          .catch(function (err) {
            log("回放请求错误: " + err.message, "error");
            playbackBtn.disabled = false;
          });
      }

      playbackBtn.addEventListener("click", runPlayback);
      loadGraph();
      loadIntents();
    })();
  </script>
</body>
</html>
